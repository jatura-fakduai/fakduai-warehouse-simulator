name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Pages project when missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: fakduai-warehouse-simulator
        shell: bash
        run: |
          projects="$(npx --yes wrangler@4 pages project list --json)"
          if node -e 'const projects = JSON.parse(process.argv[1]); process.exit(projects.some(project => project.name === process.env.PAGES_PROJECT_NAME) ? 0 : 1)' "$projects"; then
            echo "Cloudflare Pages project already exists."
          else
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy static site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy public --project-name=fakduai-warehouse-simulator --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
